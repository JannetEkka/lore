<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Lore works</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;750&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
</head>
<body>
<div class="topbar">
  <a class="logo" href="/"><span class="dot"></span>Lore</a>
  <span class="spacer"></span>
  <a class="btn small primary" href="/app?project=FalkorDB">Try it</a>
  <a class="btn small" href="https://github.com/JannetEkka/lore">GitHub</a>
</div>
<article class="doc" id="doc"><p class="muted">Loading…</p></article>
<script>
fetch('/README.md').then(r => r.text()).then(md => {
  const doc = document.getElementById('doc');
  doc.innerHTML = marked.parse(md);
  doc.querySelectorAll('code.language-mermaid').forEach(c => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
  mermaid.run();
});
</script>
</body>
</html>
