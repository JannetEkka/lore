# Keeps Lore's ready-made projects current: fetches each one's public GitHub history every
# six hours and commits the snapshot. The app and the backtest load these files.
name: Snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snapshot.yml", "lore/github.py"]

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"
      - name: Fetch FalkorDB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python -m lore fetch FalkorDB
          --repos FalkorDB/FalkorDB,FalkorDB/falkordb-browser,FalkorDB/GraphRAG-SDK,FalkorDB/QueryWeaver,FalkorDB/falkordb-py,FalkorDB/docs
          --out data/snapshots/FalkorDB.json.gz
      - name: Commit the snapshot
        # A snapshot is one binary file, so put the new one on top of the latest main instead of rebasing.
        run: |
          cp data/snapshots/FalkorDB.json.gz "$RUNNER_TEMP/snapshot.json.gz"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/snapshots
          cp "$RUNNER_TEMP/snapshot.json.gz" data/snapshots/FalkorDB.json.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot: FalkorDB, $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
